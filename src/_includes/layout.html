<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#f5f2ea">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{SITE_URL}}/assets/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAGE_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{SITE_URL}}/assets/social-card.png">
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css">
  {{SCHEMA}}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="wrap nav">
  <a class="brand" href="/">{{SITE_NAME}}<small>{{TAGLINE}}</small></a>
  <nav class="nav-links" aria-label="Primary">{{NAVIGATION}}</nav>
</div></header>
<main id="main">{{CONTENT}}</main>
<footer class="footer"><div class="wrap footer-grid">
  <div>© <span data-year></span> {{SITE_NAME}}<div class="smallprint">{{FOOTER_NOTE}}</div></div>
  <nav class="footer-links" aria-label="Footer">{{FOOTER_NAV}}</nav>
</div></footer>
<script src="/assets/site.js"></script>
</body></html>
